<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkers · HostedGames sample</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main class="layout">
    <section class="board-wrap">
      <div id="board" aria-label="Checkers board"></div>
    </section>
    <aside class="panel">
      <h1>Checkers</h1>
      <div class="controls">
        <label>Opponent
          <select id="mode">
            <option value="ai">Computer</option>
            <option value="human">Second player (same device)</option>
          </select>
        </label>
        <label id="level-wrap">Level
          <select id="level"></select>
        </label>
      </div>
      <div class="buttons">
        <button id="undo">Undo</button>
        <button id="suggest" class="primary">Suggest</button>
        <button id="restart">New game</button>
      </div>
      <p id="status" role="status"></p>
      <p id="hint" class="hint"></p>
      <h2>Commentary</h2>
      <ol id="notes" class="notes"></ol>
      <p class="help">Red moves first (vs the computer you are Red). Captures are mandatory; keep jumping while you can. Reach the far row to crown a king. Every move is graded; a positive eval favours Red (100 = one man).</p>
    </aside>
  </main>
  <script src="game.js?v=2"></script>
</body>
</html>
